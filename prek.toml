#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", stages = [
        "pre-commit",
    ] },
    { id = "end-of-file-fixer", stages = [
        "pre-commit",
    ] },
    { id = "check-added-large-files", stages = [
        "pre-commit",
    ] },
]

[[repos]]
repo = "local"
hooks = [
    { id = "release-on-tag-push", name = "pnpm release on tag push", language = "system", entry = "node scripts/hooks/pre-push-release.mjs", stages = [
        "pre-push",
    ], always_run = true, pass_filenames = false },
]
